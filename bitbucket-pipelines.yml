# This is a sample build configuration for PHP.
# Check our guides at https://confluence.atlassian.com/x/e8YWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
#
# You can specify a custom docker image from Docker Hub as your build environment.
image: php:7.1.29
options:
  max-time: 60
pipelines:
  branches:
    development:
      - step:
          caches:
            - composer
          script:
            - pipe: atlassian/ssh-run:0.2.2
              variables:
                SSH_USER: $BC_DEV_SSH_USER
                SERVER: $DEV_SERVER_IP
                MODE: 'command'
                COMMAND: '$DEV_COMMAND/bigcommerce/bc/remote-script.sh'

    qa:
      - step:
          caches:
            - composer
          script:
            - pipe: atlassian/ssh-run:0.2.2
              variables:
                SSH_USER: $BC_STAGING_SSH_USER
                SERVER: $STAGING_SERVER_IP
                MODE: 'command'
                COMMAND: '$STAGING_COMMAND/bigcommerce/bc/remote-script.sh'

    master:
      - step:
          caches:
            - composer
          script:
            - pipe: atlassian/ssh-run:0.2.2
              variables:
                SSH_USER: $RTSQ_PRO_SSH_USER
                SERVER: $RTSQ_PRO_SERVER_IP
                MODE: 'command'
                COMMAND: '$RTSQ_PRO_COMMAND/bigcommerce/remote-script.sh'
